<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function() {
      var t = localStorage.getItem('docanalyzer_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Started - DocumentIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div style="position: absolute; top: 20px; right: 20px;">
    <button type="button" class="theme-btn" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>

<div class="auth-card">
  <div class="auth-header">
    <a href="{{ url_for('home') }}" class="pub-brand" style="justify-content: center; margin-bottom: 14px;">
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </div>
      <span>DocumentIQ</span>
    </a>
    <h2>Create your enterprise account</h2>
    <p class="muted">Start analyzing agreements and managing obligations.</p>
  </div>

  {% if error %}
  <div class="dz-error" style="margin-bottom: 16px;">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required  autofocus>
    </div>

    <div class="form-group">
      <label for="email">Work Email</label>
      <input type="email" id="email" name="email" required >
    </div>

    <div class="form-group">
      <label for="company">Company / Organization</label>
      <input type="text" id="company" name="company" >
    </div>

    <div class="form-group">
      <label for="password">Create Password (min. 6 chars)</label>
      <input type="password" id="password" name="password" required >
    </div>

    <button type="submit" class="btn primary wide" style="margin-top: 20px; padding: 11px;">
      Create Account &amp; Launch Dashboard
    </button>
  </form>

  <div class="auth-footer">
    <p>Already have an account? <a href="{{ url_for('login') }}" class="link">Sign In</a></p>
    <p style="margin-top: 8px;"><a href="{{ url_for('home') }}" class="muted" style="text-decoration: none;">&larr; Return to public homepage</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
